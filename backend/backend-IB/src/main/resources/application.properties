spring.application.name=backend-IB
server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:server.p12
server.ssl.key-store-password=NekaSifra
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=18000000
jwt.refresh-expiration-ms=1209600000
jwt.totp-expiration-ms=120000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.from=${MAIL_FROM}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 32 bytes long master key in base64 format
app.master-key=${MASTER_KEY}
app.master-key-rotation-interval-days=2
app.master-key-rotation-batch-size=50

# CRL distribution point for issued certificates
app.crl-url=${CRL_URL:https://localhost:8443/api/certificates/crl}
