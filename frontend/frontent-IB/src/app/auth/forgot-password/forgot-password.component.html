<div class="card">

  <h2>Zaboravljena lozinka</h2>

  <div *ngIf="step === 1">
    <input [(ngModel)]="email" placeholder="Email">
    <button
      type="button"
      (click)="requestRecovery()"
      [disabled]="loading"
    >
      {{ loading ? 'Slanje...' : 'Pošalji zahtev za reset lozinke' }}
    </button>
  </div>

  <div *ngIf="step === 2">
    <p>Otpremite privatni kljuc</p>

    <input type="file" (change)="onFile($event)" accept=".pem">

    <input [(ngModel)]="newPassword" type="password" placeholder="New password">

    <button type="button" (click)="resetPassword()">
      Resetuj lozinku
    </button>
  </div>

</div>
