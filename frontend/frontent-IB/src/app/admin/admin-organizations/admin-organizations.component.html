<h2>Create Organization</h2>

<form (ngSubmit)="createOrganization()">
  <input [(ngModel)]="orgName" name="orgName" placeholder="Organization name">
  <button type="submit">Create</button>
</form>

<h2>Organizations</h2>

<table>
  <tr>
    <th>ID</th>
    <th>Name</th>
  </tr>

  <tr *ngFor="let org of organizations">
    <td>{{ org.id }}</td>
    <td>{{ org.name }}</td>
  </tr>
</table>
