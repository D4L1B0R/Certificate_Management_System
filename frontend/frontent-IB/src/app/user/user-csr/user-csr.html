<h3>Upload CSR</h3>

<form [formGroup]="form" (ngSubmit)="submit()" class="csr-block">
  <div class="row">
    <label>Signing CA</label>
    <select formControlName="issuerCertificateId">
      <option [ngValue]="null" disabled>Select a CA</option>
      <option *ngFor="let ca of issuers" [ngValue]="ca.id">
        {{ ca.subjectCN }} ({{ ca.validFrom | date:'short' }} – {{ ca.validTo | date:'short' }})
      </option>
    </select>
  </div>

  <div class="row">
    <label>CSR file</label>
    <input type="file" accept=".pem,.csr" (change)="onFileSelected($event)" />
  </div>

  <div class="row">
    <label>Valid from</label>
    <input type="datetime-local" formControlName="validFrom" [min]="minDate" [max]="maxDate" />
  </div>

  <div class="row">
    <label>Valid to</label>
    <input type="datetime-local" formControlName="validTo" [min]="minDate" [max]="maxDate" />
  </div>

  <button type="submit" [disabled]="form.invalid || submitting">
    {{ submitting ? 'Issuing…' : 'Issue certificate' }}
  </button>
</form>

<div *ngIf="issuedCert" class="result-block">
  <p>Certificate issued (serial {{ issuedCert.serialNumber }}).</p>
  <button (click)="download('cer')">Download .cer</button>
  <button (click)="download('pem')">Download .pem</button>
</div>

<div *ngIf="error" style="margin-top: 10px; color: #b00020;">{{ error }}</div>
