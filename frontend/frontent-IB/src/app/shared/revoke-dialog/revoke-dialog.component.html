<div class="backdrop" (click)="close()"></div>

<div class="modal">
  <h3>Revoke certificate</h3>

  <p *ngIf="certId">
    Certificate ID: <b>#{{ certId }}</b>
  </p>

  <label>Reason (X.509)</label>

  <select [(ngModel)]="reason">
    <option [ngValue]="null">Select reason</option>

    <option *ngFor="let r of reasons" [ngValue]="r">
      {{ r }}
    </option>
  </select>

  <div class="buttons">
    <button class="cancel" (click)="close()">Cancel</button>

    <button
      class="confirm"
      [disabled]="!reason"
      (click)="confirm()">
      Confirm revoke
    </button>
  </div>

</div>
