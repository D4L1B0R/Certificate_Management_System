<h3>Generate certificate</h3>

<form (ngSubmit)="submit()" class="issue-form">
  <div class="row">
    <label>Type</label>
    <select [(ngModel)]="form.type" name="type" (change)="onTypeChange()">
      <option *ngFor="let t of allowedTypes" [ngValue]="t.value">
        {{ t.label }}
      </option>
    </select>
  </div>

  <fieldset>
    <legend>Subject (X500Name - simplified)</legend>

    <div class="row">
      <label>CN</label>
      <input [(ngModel)]="form.commonName" name="cn" placeholder="Common Name" />
    </div>

    <div class="row">
      <label>Organization</label>

      <!-- ROOT_CA -> admin choose -->
      <select
        *ngIf="isRoot() && mode === 'admin'; else defaultOrg"
        [(ngModel)]="form.organizationId"
        name="organizationId">
        <option *ngFor="let org of organizations" [ngValue]="org.id">
          {{ org.name }}
        </option>
      </select>

      <!-- NON-ROOT -> fixed / default -->
      <ng-template #defaultOrg>
        <input
          [value]="'Default Organization'"
          disabled />
      </ng-template>
    </div>

    <ng-template #fixedOrg>
      <div class="row">
        <label>Organization</label>
        <input [value]="fixedOrganizationName || 'Loading organization...'" disabled />
      </div>
    </ng-template>

    <div class="row">
      <label>OU</label>
      <input [(ngModel)]="form.organizationalUnit" name="ou" placeholder="Organizational Unit" />
    </div>

    <div class="row">
      <label>C</label>
      <input [(ngModel)]="form.country" name="country" placeholder="RS" maxlength="2" />
    </div>
  </fieldset>

  <fieldset>
    <legend>Validity</legend>
    <div class="row">
      <label>Valid From</label>
      <input [(ngModel)]="form.validFrom" name="from" type="datetime-local" />
    </div>

    <div class="row">
      <label>Valid To</label>
      <input [(ngModel)]="form.validTo" name="to" type="datetime-local" />
    </div>
  </fieldset>

  <fieldset *ngIf="form.type !== 'ROOT_CA'">
    <legend>Issuer (CA certificate)</legend>

    <div class="row">
      <label>Issuer</label>
      <select [(ngModel)]="form.issuerCertificateId" name="issuerCertificateId">
        <option [ngValue]="null">-- select issuer --</option>
        <option *ngFor="let i of issuerCandidates" [ngValue]="i.id">
          {{ i.subjectCN }} ({{ i.type }})
        </option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend>Extensions (optional)</legend>

    <div class="row">
      <label>
        <input type="checkbox" [(ngModel)]="extensionUi.basicConstraintsCa" name="basicConstraintsCa" />
        BasicConstraints: CA
      </label>
    </div>

    <div class="row" *ngIf="extensionUi.basicConstraintsCa">
      <label>pathLenConstraint</label>
      <input type="number" [(ngModel)]="extensionUi.pathLenConstraint" name="pathLenConstraint" placeholder="(optional)" />
    </div>

    <div class="grid">
      <div>
        <strong>KeyUsage</strong>
        <div class="check" *ngFor="let ku of keyUsageOptions">
          <label>
            <input type="checkbox" [(ngModel)]="extensionUi.keyUsages[ku.key]" [name]="'ku_' + ku.key" />
            {{ ku.label }}
          </label>
        </div>
      </div>

      <div>
        <strong>ExtendedKeyUsage</strong>
        <div class="check" *ngFor="let eku of ekUOptions">
          <label>
            <input type="checkbox" [(ngModel)]="extensionUi.extendedKeyUsages[eku.key]" [name]="'eku_' + eku.key" />
            {{ eku.label }}
          </label>
        </div>
      </div>
    </div>
  </fieldset>

  <fieldset *ngIf="form.type === 'END_ENTITY'">
    <legend>Keystore (PKCS#12)</legend>

    <div class="row">
      <label>Keystore password</label>
      <input type="password" [(ngModel)]="keystorePassword" name="keystorePassword" minlength="8" />
    </div>

    <div class="row">
      <label>Confirm password</label>
      <input type="password" [(ngModel)]="keystorePasswordConfirm" name="keystorePasswordConfirm" minlength="8" />
    </div>
  </fieldset>

  <button type="submit" (click)="submit()" [disabled]="submitting">
    {{ submitting ? 'Issuing...' : 'Issue' }}
  </button>

  <div *ngIf="submitOk" style="margin-top: 10px; color: #0a7a0a;">
    {{ submitOk }}
  </div>
  <div *ngIf="submitErr" style="margin-top: 10px; color: #b00020;">
    {{ submitErr }}
  </div>
</form>
